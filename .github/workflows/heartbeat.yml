name: heartbeat

# GitHub switches scheduled workflows off in a public repo after 60 days with no
# repository activity. This writes one small commit a week so the health check's
# schedule is not silently disabled.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the heartbeat
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "chore: heartbeat"
          git push
